<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Plantão</title>
<style>
:root{
  --bg:#f4f1e9;--panel:#fbf9f3;--inset:#ece8dc;--line:#d5cfbf;--text:#16302a;--soft:#3d544d;--muted:#65776f;
  --accent:#0a6f56;--accent-t:#085f4a;--on-accent:#fff;--tip:#e2eee6;--red:#b3362b;--amber:#8f5a00;--grid:rgb(10 111 86/.07);
  --screen:#10231f;--screen-t:#6fe3bb;--screen-m:#8fb0a5;
  --c1:#0a6f56;--c2:#a8551c;--c3:#23628f;--c4:#74508f;color-scheme:light;
  --head:Bahnschrift,"DIN Alternate","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",monospace;
}
:root[data-theme="dark"]{
  --bg:#0c1716;--panel:#12201e;--inset:#1a2b28;--line:#2a403b;--text:#e8f1ed;--soft:#bdcdc7;--muted:#88a097;
  --accent:#4fd1a5;--accent-t:#6fe3bb;--on-accent:#08201a;--tip:#16302a;--red:#ff8f80;--amber:#f0bd62;--grid:rgb(79 209 165/.06);
  --screen:#081311;--screen-t:#6fe3bb;--screen-m:#7f9b91;
  --c1:#4fd1a5;--c2:#eb9a5c;--c3:#70b5e6;--c4:#c0a0e0;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg{display:block;flex:none}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--head);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.side{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:22px;height:56px;padding:0 max(24px,calc((100% - 1312px)/2));background:var(--screen);color:#e8f1ed}
.brand{display:flex;align-items:center;gap:9px;flex:none;font-family:var(--head);font-size:17px;font-weight:600;letter-spacing:.01em}
.brand span{color:var(--screen-t);display:grid}
.navs{display:flex;align-items:stretch;gap:2px;min-width:0;flex:1;height:100%;overflow-x:auto;scrollbar-width:none}
.nav{display:flex;align-items:stretch;gap:2px}
#nav2{margin-left:auto}
.nav button{position:relative;display:flex;align-items:center;gap:7px;padding:0 11px;color:#a9c0b8;font-size:14px;font-weight:500;white-space:nowrap}
.nav button svg{width:16px;height:16px}
.nav button:hover{color:#fff}
.nav button.on{color:#fff;font-weight:600}
.nav button.on::after{content:"";position:absolute;left:11px;right:11px;bottom:0;height:3px;background:var(--screen-t)}
.nav button.on svg{color:var(--screen-t)}
.nav .n{font:12px var(--mono);color:#7f9b91}
.nav .n:empty{display:none}
.side-end{flex:none}
.theme{display:flex;align-items:center}.theme>span{display:none}
.side-end{display:flex;align-items:center;gap:8px}
.updb{width:32px;height:32px;display:grid;place-items:center;border:1px solid #2c4640;border-radius:6px;color:#a9c0b8}
.updb:hover{color:#fff;background:#223a35}.updb[hidden]{display:none}
.bar{height:8px;margin-top:12px;background:var(--inset);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.seg{display:flex;border:1px solid #2c4640;border-radius:6px;overflow:hidden}
.seg button{width:32px;height:30px;display:grid;place-items:center;color:#8fb0a5}
.seg button.on{background:#223a35;color:#fff}
.content{min-width:0}
#view{display:block;max-width:1360px;margin:0 auto;padding:0 24px 40px}
.top{position:sticky;top:56px;z-index:7;display:flex;align-items:center;gap:10px;margin:0 0 24px;padding:14px max(24px,calc((100% - 1312px)/2));background-color:var(--panel);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px;border-bottom:1px solid var(--line)}
.top h1{font-size:24px;line-height:1.15;margin-right:auto;white-space:nowrap}
.top h1 span{color:var(--muted);font-family:var(--mono);font-size:17px;font-weight:400;margin-left:4px}
.ctl{display:flex;align-items:center;gap:8px;height:42px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 11px;color:var(--muted)}
.ctl:focus-within{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ctl input{border:0;outline:0;background:none;color:var(--text);min-width:0}
.ctl.s input{width:320px}.ctl.w input{width:58px;font:600 15px var(--mono)}
.ctl input::-webkit-inner-spin-button{display:none}
.kbd{font:12px var(--mono);color:var(--muted);white-space:nowrap}
.pri,.sec{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:6px;font-weight:600;white-space:nowrap}
.pri{height:42px;padding:0 16px;background:var(--accent);color:var(--on-accent)}
.pri:hover{filter:brightness(1.08)}
.sec{height:36px;padding:0 12px;border:1px solid var(--line);font-size:13.5px}
.sec:hover{background:var(--inset)}
.icon{width:36px;height:36px;display:inline-grid;place-items:center;border:1px solid var(--line);border-radius:6px;color:var(--soft)}
.icon:hover{background:var(--inset)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.card{padding:20px;min-width:0}
.home{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:32px 32px}
.block{min-width:0;border-top:2px solid var(--text);padding-top:12px}
.lib{grid-column:span 8}.dosebox{grid-column:span 4}.tri{grid-column:span 4}
.bh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.bh h2{font-size:18px}
.leg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
.idx{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;padding:13px 2px;border-bottom:1px solid var(--line);text-align:left;font-weight:600}
.idx svg{color:var(--k)}
.idx b{font:600 22px var(--mono)}
.idx:hover span{color:var(--accent-t);text-decoration:underline;text-underline-offset:3px}
.dropc{display:flex;align-items:center;gap:12px;width:100%;margin-top:16px;padding:14px;border:1px dashed var(--muted);border-radius:6px;text-align:left;color:var(--muted)}
.dropc:hover{border-color:var(--accent)}.dropc svg{color:var(--accent-t)}.dropc b{display:block;color:var(--text)}
.screen{background:var(--screen);border-radius:6px;padding:14px 16px;color:var(--screen-t);font-family:var(--mono);font-variant-ligatures:none}
.screen>b{display:block;font-size:34px;line-height:1.1;font-weight:600}
.screen>b i{font-style:normal;font-size:16px;color:var(--screen-m);margin-left:6px}
.screen>small{display:block;color:var(--screen-m);font-size:12px;margin-top:3px}
.vals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px;padding-top:10px;border-top:1px solid #29423c}
.vals span{display:block;color:var(--screen-m);font-size:12px}.vals b{font-size:15px}
.note{margin-top:10px;font-size:13.5px;color:var(--muted)}
.link{color:var(--accent-t);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.rows{display:flex;flex-direction:column}
.ri{display:flex;align-items:center;gap:10px;width:100%;padding:9px 0;border-bottom:1px solid var(--line);text-align:left}
.ri>span{min-width:0;flex:1}.ri b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri>svg{color:var(--muted)}.ri:hover b{color:var(--accent-t)}
.more{margin-top:10px}
.sub{color:var(--muted);font-size:14px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}.head p{color:var(--muted)}
.hbtn{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:14px;align-items:start}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.rec{padding:16px}
.rec h3{font-size:17px;overflow-wrap:anywhere}
.acts{display:flex;align-items:center;gap:3px;flex:none}
.star{width:32px;height:32px;display:grid;place-items:center;border-radius:6px;color:var(--muted)}
.star:hover{background:var(--inset)}.star.on{color:var(--amber)}.star.on path{fill:currentColor}
.src{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:12.5px;color:var(--muted)}
.dot{width:8px;height:8px;flex:none}
dl{margin:12px 0 0}dl div{padding:8px 0;border-top:1px solid var(--line)}
dt{font-size:12.5px;color:var(--muted)}dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.res{background:var(--screen);color:var(--screen-t);border-radius:6px;padding:10px 12px;margin-top:12px;font-family:var(--mono)}
.res small{display:block;color:var(--screen-m);font-size:12px}
.res b{font-size:16px;font-weight:600}.res em{display:block;font-style:normal;font-size:12.5px;color:#f0bd62}
.body{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px;color:var(--soft);font-size:14px}
details summary{cursor:pointer;color:var(--accent-t);font-weight:600;font-size:13.5px;margin-top:8px}
.rf,.ca{display:flex;gap:8px;margin-top:12px}.ca{margin-top:10px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px}
label{font-size:13px;color:var(--muted)}
.form input,.form select,select.sel{display:block;width:100%;height:38px;margin-top:3px;padding:0 9px;background:var(--inset);border:1px solid var(--line);border-radius:6px;color:var(--text)}
select option{background:var(--panel)}
[data-calc=c-glasgow] label,[data-calc=c-cha] label:has(select){grid-column:1/-1}
.form .ck{grid-column:1/-1;display:flex;align-items:center;gap:9px;color:var(--soft);font-size:14px}
.form .ck input{width:18px;height:18px;margin:0;flex:none;accent-color:var(--accent)}
.out{display:flex;align-items:center;background:var(--screen);color:var(--screen-t);border-radius:6px;padding:12px;margin-top:12px;font:600 18px/1.3 var(--mono);min-height:54px}
.out.w{font:400 13.5px "Segoe UI",system-ui,sans-serif;color:var(--screen-m)}
.chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px;padding:2px;border-bottom:1px solid var(--line)}
.chip{flex:none;height:36px;padding:0 11px;color:var(--soft);font-size:13.5px;font-weight:600;border-bottom:3px solid transparent}
.chip:hover{color:var(--accent-t)}.chip.on{color:var(--text);border-bottom-color:var(--accent)}
.chip span{font:400 12px var(--mono);color:var(--muted);margin-left:5px}
mark{background:color-mix(in srgb,var(--amber) 32%,transparent);color:inherit;border-radius:2px;padding:0 1px}
.ft{display:grid;grid-template-columns:44px minmax(0,1fr) 150px 90px 88px;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.ft:first-child{border-top:0}.ft b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ft small{color:var(--muted)}
.ft>div:last-child{display:flex;gap:6px;justify-content:flex-end}
.ext{width:44px;height:30px;border:1px solid var(--line);border-radius:4px;color:var(--soft);font:600 11px var(--mono);display:grid;place-items:center}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:48px 20px;color:var(--muted)}.empty b{font:600 18px var(--head);color:var(--text)}.empty .pri{margin-top:6px}
.emark{color:var(--accent-t)}
dialog{width:min(680px,calc(100vw - 32px));max-height:calc(100vh - 32px);padding:22px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:8px}
dialog::backdrop{background:rgb(4 12 10/.65)}
dialog h2{font-size:20px}
.ii{display:grid;grid-template-columns:44px minmax(0,1fr) 150px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.ii b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ii small{display:block;color:var(--muted)}.ii .bad{color:var(--red)}
.ii label{display:flex;align-items:center;gap:5px;margin-top:3px}
.priv{background:var(--inset);border-radius:6px;padding:10px 12px;font-size:13.5px;color:var(--soft);margin:12px 0 16px}
.da{display:flex;justify-content:flex-end;gap:8px}.da .sec{height:42px}
.stackf{display:grid;gap:12px;margin:14px 0 0}
.stackf input,.stackf select,.stackf textarea{display:block;width:100%;margin-top:3px;padding:9px;background:var(--inset);border:1px solid var(--line);border-radius:6px;color:var(--text)}
.stackf textarea{min-height:190px;resize:vertical}
.err{color:var(--red);font-size:13.5px;min-height:1.2em}
#drop{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgb(4 12 10/.85);color:#fff;pointer-events:none;font:600 22px var(--head)}
#drop.on{display:grid}#drop div{padding:50px 70px;border:2px dashed #6fe3bb;border-radius:8px}
#toast{position:fixed;right:24px;bottom:24px;z-index:40;background:var(--screen);color:var(--screen-t);border-left:3px solid var(--screen-t);padding:10px 14px;border-radius:4px;font-weight:600;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none}
#toast.on{opacity:1;transform:none}
@media(max-width:1240px){.ctl.s input{width:190px}.brand b{display:none}.lib,.dosebox{grid-column:span 12}.tri{grid-column:span 6}}
@media(max-width:940px){
  .side{position:static;flex-wrap:wrap;height:auto;gap:0 12px;padding:10px 16px 0}
  .brand{flex:1}.brand b{display:inline}
  .navs{order:3;flex:0 0 100%;height:42px;margin-top:6px}
  #nav2{margin-left:0}
  #view{padding:0 16px 28px}
  .top{position:static;flex-wrap:wrap;margin:0 0 18px;padding:12px 16px}
  .top h1{width:100%;font-size:21px}
  .ctl.s{flex:1 1 100%}.ctl.s input{flex:1;width:auto}.kbd{display:none}
  .ctl.w{flex:1}.ctl.w input{flex:1;width:auto}
  .home{gap:24px}.tri{grid-column:span 12}
  .ft{grid-template-columns:44px minmax(0,1fr) auto}.ft>.fsel,.ft>.fn{grid-column:2/-1}.ft>div:last-child{grid-column:3;grid-row:1}
  .ii{grid-template-columns:44px minmax(0,1fr)}.ii>div:last-child{grid-column:2}
  #toast{left:16px;right:16px;bottom:16px}
}
@media(max-width:520px){.leg{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<aside class="side">
  <div class="brand"><span id="logo"></span><b>Plantão</b></div>
  <div class="navs">
    <nav class="nav" id="nav" aria-label="Seções"></nav>
    <nav class="nav" id="nav2" aria-label="Biblioteca"></nav>
  </div>
  <div class="side-end"><button class="updb" id="upd" hidden data-updates aria-label="Buscar atualizações" title="Buscar atualizações"></button><div class="theme"><span>Aparência</span><div class="seg" id="seg"></div></div></div>
</aside>
<div class="content">
  <header class="top">
    <h1 id="title"></h1>
    <label class="ctl s"><span id="si"></span><input id="q" type="search" placeholder="Buscar medicamento, conduta, cálculo" aria-label="Buscar" autocomplete="off"><span class="kbd">Ctrl K</span></label>
    <label class="ctl w"><input id="kg" type="number" min="0.3" max="300" step="0.1" inputmode="decimal" placeholder="Peso" aria-label="Peso do paciente em quilos"><span>kg</span></label>
    <button class="pri" data-import=""><span id="pi"></span>Importar</button>
  </header>
  <main id="view"></main>
</div>
<input id="file" type="file" multiple hidden accept=".csv,.tsv,.xlsx,.json,.txt,.md,.docx,.pdf,.png,.jpg,.jpeg,.webp">
<input id="restore" type="file" hidden accept=".json">
<dialog id="dlg" aria-labelledby="dt"></dialog>
<div id="drop"><div>Solte os arquivos para importar</div></div>
<div id="toast" role="status"></div>

<script>
const P={grid:'<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',pill:'<path d="m10.5 20.5 10-10a5 5 0 0 0-7-7l-10 10a5 5 0 0 0 7 7ZM8.5 8.5l7 7"/>',rx:'<path d="M6 2h9l4 4v16H6zM14 2v5h5M9 13h7M9 17h7"/>',clip:'<path d="M9 3h6v4H9zM9 5H5v17h14V5h-4M9 13h6M9 17h6"/>',box:'<path d="M3 6h6l2 3h10v11H3z"/>',calc:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8.5 6h7M8.5 11h.01M12 11h.01M15.5 11h.01M8.5 14.5h.01M12 14.5h.01M15.5 14.5h.01M8.5 18h.01M12 18h.01M15.5 18h.01"/>',star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2-5.5-2.9-5.5 2.9 1-6.2L3 9.6l6.2-.9z"/>',up:'<path d="M12 16V4M7 9l5-5 5 5M4 16v4h16v-4"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/>',moon:'<path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z"/>',pulse:'<path d="M3 12h4l2-6 4 12 2-6h6"/>',scale:'<path d="M5 4h14l2 16H3zM9 9a3 3 0 0 1 6 0"/>',bulb:'<path d="M9 18h6M10 21h4M8 14a6 6 0 1 1 8 0c-1 1-1 2-1 2H9s0-1-1-2z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/>',open:'<path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/>',left:'<path d="m15 5-7 7 7 7"/>',right:'<path d="m9 5 7 7-7 7"/>',down:'<path d="M12 4v12M7 11l5 5 5-5M4 20h16"/>',plus:'<path d="M12 5v14M5 12h14"/>',sync:'<path d="M20 11a8 8 0 0 0-14-4L4 9M4 4v5h5M4 13a8 8 0 0 0 14 4l2-2M20 20v-5h-5"/>'};
const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const CATS={doses:['Doses','pill','var(--c1)'],prescricoes:['Prescrições','rx','var(--c2)'],protocolos:['Protocolos','clip','var(--c3)'],outros:['Outros','box','var(--c4)']};
const CK=Object.keys(CATS);
const CG={all:'Todas',renal:'Renal e eletrólitos',fluidos:'Infusão e fluidos',clinica:'Clínica geral',escores:'Escores'};
const SEXO=['Masculino','Feminino'];
const points=v=>Object.values(v).reduce((s,x)=>s+(parseInt(x,10)||0),0);
const pts=n=>plural(n,'ponto','pontos');
const CALCS=[
 {id:'c-clcr',g:'renal',title:'Clearance de creatinina',alias:'cockcroft gault função renal',desc:'Cockcroft-Gault',f:[['idade','Idade (anos)'],['peso','Peso (kg)'],['cr','Creatinina (mg/dL)'],['sexo','Sexo',['Masculino','Feminino']]],run:v=>fmt((140-v.idade)*v.peso/(72*v.cr)*(v.sexo==='Feminino'?.85:1))+' mL/min'},
 {id:'c-inf',g:'fluidos',title:'Infusão contínua',alias:'bomba vasopressor mcg kg min ml h',desc:'mcg/kg/min para mL/h',f:[['dose','Dose (mcg/kg/min)'],['peso','Peso (kg)'],['mg','Droga na solução (mg)'],['vol','Volume total (mL)']],run:v=>fmt(v.dose*v.peso*60*v.vol/(v.mg*1000))+' mL/h'},
 {id:'c-holliday',g:'fluidos',title:'Holliday-Segar',alias:'manutenção hidratação pediatria soro',desc:'Manutenção hídrica',f:[['peso','Peso (kg)']],run:v=>{const d=holliday(v.peso);return fmt(d)+' mL/dia · '+fmt(d/24)+' mL/h'}},
 {id:'c-ag',g:'renal',title:'Ânion gap',alias:'acidose metabólica gasometria',desc:'Na − (Cl + HCO₃)',f:[['na','Sódio (mEq/L)'],['cl','Cloro (mEq/L)'],['hco','Bicarbonato (mEq/L)']],run:v=>fmt(v.na-v.cl-v.hco)+' mEq/L'},

function decode(buf){try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch{return new TextDecoder('windows-1252').decode(buf)}}

  const H=clean[0].map((h,i)=>h||'Coluna '+(i+1)),K=H.map(key);
  let ti=K.findIndex(k=>/^(medicamento|farmaco|droga|nome|titulo|protocolo|prescricao|item|doenca)/.test(k));if(ti<0)ti=0;
  const col=(...n)=>{for(const x of n){const i=K.indexOf(x);if(i>=0)return i}return-1};
  const C={a:col('dose_min_kg','dose_kg'),b:col('dose_max_kg','dose_kg'),cap:col('dose_maxima'),fl:col('dose_minima'),u:col('unidade'),c:col('concentracao'),d:col('tomadas_dia')};
  return clean.slice(1).map((r,n)=>{
    const rec={title:r[ti]||'Linha '+(n+2),fields:H.map((h,i)=>[h,r[i]||'',i]).filter(x=>x[2]!==ti&&x[1]).map(x=>[x[0],x[1]])};

async function unzip(buf){

async function parseFile(file){
  const ext=extOf(file.name),base=file.name.replace(/\.[^.]+$/,'');

  S.cat='';dlg.innerHTML=`<h2 id="dt">Novo registro</h2><p class="sub">Escreva uma prescrição, um protocolo ou uma anotação.</p><div class="stackf"><label>Título<input id="nt" maxlength="120" autocomplete="off"></label><label>Categoria<select id="nc">${catOpts(cat||(CATS[S.view]?S.view:'prescricoes'))}</select></label><label>Texto<textarea id="nx"></textarea></label><p class="err" id="ne" role="alert"></p></div><div class="priv">O registro fica apenas neste navegador, sem criptografia. Não inclua dados que identifiquem pacientes.</div><div class="da"><button class="sec" data-cancel>Cancelar</button><button class="pri" data-savenew>Salvar</button></div>`;
  dlg.showModal();$('#nt').focus();
}
async function saveNew(){
  const title=$('#nt').value.trim(),text=$('#nx').value.trim(),cat=$('#nc').value,name=title.replace(/[\\/:*?"<>|]+/g,'-')+'.txt',fail=m=>{$('#ne').textContent=m};
  if(!title||!text)return fail('Preencha o título e o texto.');
  if(S.files.some(f=>norm(f.name)===norm(name)))return fail('Já existe um arquivo com esse nome.');
  const blob=new Blob([text]);
  try{await dbPut({id:newId(),name,ext:'txt',size:blob.size,cat,at:Date.now(),recs:[{title,text}],blob})}catch{return fail('Não foi possível salvar. Verifique o espaço do navegador.')}
  S.view=cat;q.value='';await reload();closeDialog();toast('Registro salvo');
}

/* Backup */
function saveAs(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000)}
async function toB64(blob){const b=new Uint8Array(await blob.arrayBuffer()),out=[];for(let i=0;i<b.length;i+=32766)out.push(btoa(String.fromCharCode(...b.subarray(i,i+32766))));return out.join('')}
function fromB64(s){const t=atob(s),b=new Uint8Array(t.length);for(let i=0;i<t.length;i++)b[i]=t.charCodeAt(i);return b}
async function exportBackup(){
  if(!S.files.length)return toast('Ainda não há arquivos para exportar');
  if(S.files.reduce((s,f)=>s+f.size,0)*4/3>MAX_BACKUP_MB*1048576)return toast('A biblioteca passa do limite de '+MAX_BACKUP_MB+' MB do backup');
  try{
    const parts=['{"app":"painel-plantao","versao":1,"favs":',JSON.stringify(S.favs),',"files":['];
    for(const[i,f]of S.files.entries()){const{blob,...meta}=f;parts.push((i?',':'')+JSON.stringify({...meta,data:await toB64(blob)}))}
    parts.push(']}');saveAs(new Blob(parts,{type:'application/json'}),'painel-plantao-backup-'+new Date().toLocaleDateString('sv')+'.json');toast('Backup exportado');
  }catch{toast('Não foi possível gerar o backup')}
}
const bad=()=>{throw Error('Backup inválido')};
const optNum=x=>x==null||Number.isFinite(x);
function cleanRec(r){
  if(typeof r?.title!=='string'||!r.title)bad();const o={title:r.title};if(r.doc===true)o.doc=true;
  if(r.text!=null){if(typeof r.text!=='string')bad();o.text=r.text}
  if(r.fields!=null){if(!Array.isArray(r.fields)||!r.fields.every(f=>Array.isArray(f)&&f.length===2&&f.every(x=>typeof x==='string')))bad();o.fields=r.fields}
  if(r.calc!=null){const c=r.calc;if(!Number.isFinite(c.a)||!Number.isFinite(c.b)||!(c.a>0&&c.b>=c.a)||typeof c.u!=='string'||![c.cap,c.fl,c.c,c.d].every(optNum))bad();o.calc={a:c.a,b:c.b,cap:c.cap??null,fl:c.fl??null,u:c.u,c:c.c??null,d:c.d??null}}
  return o;
}
function cleanFile(f){
  const ext=typeof f?.name==='string'?extOf(f.name):'';if(!Object.hasOwn(FT,ext)||!Object.hasOwn(CATS,f.cat)||typeof f.data!=='string'||!Array.isArray(f.recs)||!f.recs.length)bad();
  const bytes=fromB64(f.data);return{old:String(f.id),file:{id:newId(),name:f.name,ext,size:bytes.length,cat:f.cat,at:Number.isFinite(f.at)?f.at:Date.now(),recs:f.recs.map(cleanRec),blob:new Blob([bytes])}};
}
async function restoreBackup(file){
  if(!file)return;if(file.size>MAX_BACKUP_MB*1048576)return toast('Backup maior que '+MAX_BACKUP_MB+' MB');
  let items,favs;
  try{const d=JSON.parse(await file.text());if(d?.app!=='painel-plantao'||d.versao!==1||!Array.isArray(d.files)||!d.files.length)bad();items=d.files.map(cleanFile);favs=Array.isArray(d.favs)?d.favs.filter(x=>typeof x==='string'):[]}
  catch{return toast('Backup inválido ou corrompido')}
  if(!confirm(`Restaurar ${plural(items.length,'arquivo','arquivos')}? Arquivos com o mesmo nome serão substituídos.`))return;
  const before=S.files,ids=new Map(items.map(x=>[x.old,x.file.id]));
  try{
    for(const{file:f}of items){await dbPut(f);for(const o of before.filter(x=>x.name===f.name)){await dbDel(o.id);S.favs=S.favs.filter(x=>!x.startsWith(o.id+':'))}}
    const restored=favs.flatMap(x=>{const c=x.indexOf(':');if(c<0)return CALCS.some(k=>k.id===x)?[x]:[];const id=ids.get(x.slice(0,c));return id?[id+x.slice(c)]:[]});
    S.favs=[...new Set([...S.favs,...restored])];toast(plural(items.length,'arquivo restaurado','arquivos restaurados'));
  }catch{toast('A restauração não terminou. Verifique o espaço do navegador')}
  lset('pp.favs',S.favs);await reload();
}

let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)}

function doseCalc(c,w){const n=c.d>0?c.d:1;let cap=false;const lim=v=>{let r=v*w/n;if(c.cap>0&&r>c.cap){r=c.cap;cap=true}if(c.fl>0&&r<c.fl){r=c.fl;cap=true}return r},a=lim(c.a),b=lim(c.b),rg=(x,y,u)=>(x===y?fmt(x):fmt(x)+'–'+fmt(y))+' '+u;return{main:rg(a,b,c.u)+(c.d>0?' por tomada':'')+(c.c>0?' = '+rg(a/c.c,b/c.c,'mL'):''),cap}}
function excerpt(t,terms){const n=norm(t),i=Math.min(...terms.map(x=>{const p=n.indexOf(x);return p<0?1e9:p}));if(i===1e9||i<160)return null;return'… '+t.slice(i-120,i+320)+' …'}

function calcCard(c,T=[]){const w=weight(),sv=S.cv[c.id]||{};return`<article class="calc rec panel" id="${c.id}" data-calc="${c.id}"><div class="ch"><div><h3>${hl(c.title,T)}</h3><div class="src">${esc(c.desc)}</div></div>${star(c)}</div><div class="form">${c.f.map(([k,l,o,p])=>o==='check'?`<label class="ck"><input data-k="${k}" data-p="${p}" type="checkbox" ${sv[k]?'checked':''}>${esc(l)}</label>`:`<label>${esc(l)}${o?`<select data-k="${k}">${o.map(x=>`<option ${sv[k]===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<input data-k="${k}" type="number" step="any" inputmode="decimal" value="${esc(sv[k]??(k==='peso'&&w?w:''))}">`}</label>`).join('')}</div><div class="out" aria-live="polite"></div><div class="ca"><button class="sec" data-ccopy="${c.id}" aria-label="Copiar resultado de ${esc(c.title)}">${ic('copy',15)}Copiar</button><button class="sec" data-cclear="${c.id}" aria-label="Limpar ${esc(c.title)}">Limpar</button></div></article>`}

function search(t){const T=norm(t).split(/\s+/).filter(Boolean);return{T,a:[...S.recs,...calcs()].filter(i=>T.every(x=>i.hay.includes(x))).map(i=>[i,T.reduce((s,x)=>s+(i.nt.startsWith(x)?3:i.nt.includes(x)?2:0),0)]).sort((a,b)=>b[1]-a[1]).map(x=>x[0])}}
function runCalcs(){view.querySelectorAll('[data-calc]').forEach(el=>{const c=CALCS.find(x=>x.id===el.dataset.calc),v={},raw=S.cv[c.id]={};let ok=true;el.querySelectorAll('[data-k]').forEach(i=>{const k=i.dataset.k;if(i.type==='checkbox'){raw[k]=i.checked;v[k]=i.checked?+i.dataset.p:0}else if(i.tagName==='SELECT')raw[k]=v[k]=i.value;else{raw[k]=i.value;const n=parseFloat(i.value);if(!(n>0))ok=false;v[k]=n}});const r=ok?c.run(v):null,o=el.querySelector('.out');o.textContent=r||(ok?'Confira os valores':'Preencha os campos');o.classList.toggle('w',!r)})}

async function copy(text,b){try{await navigator.clipboard.writeText(text)}catch{const a=document.createElement('textarea');a.value=text;document.body.append(a);a.select();document.execCommand('copy');a.remove()}toast('Copiado');b.blur()}
const go=v=>{S.view=v;S.sf='all';q.value='';render();scrollTo(0,0)};
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if('import' in d){S.cat=d.import;$('#file').value='';$('#file').click()}
  else if(d.go)go(d.go);
  else if(d.themeSet){S.theme=d.themeSet;lset('pp.theme',S.theme);render()}
  else if(d.fav){S.favs=S.favs.includes(d.fav)?S.favs.filter(x=>x!==d.fav):[...S.favs,d.fav];lset('pp.favs',S.favs);render()}
  else if(d.find){S.sf='all';q.value=d.find;render();scrollTo(0,0)}
  else if(d.sf){S.sf=d.sf;render()}
  else if(d.cg){S.cg=d.cg;render()}
  else if('updates' in d)openUpdates();
  else if(d.upd)desk[d.upd]();
  else if('new' in d)newRec(d.new);
  else if('savenew' in d)saveNew();
  else if('backup' in d)exportBackup();
  else if('restore' in d){$('#restore').value='';$('#restore').click()}
  else if(d.ccopy){const c=CALCS.find(x=>x.id===d.ccopy),o=document.getElementById(c.id).querySelector('.out');if(o.classList.contains('w'))toast('Ainda não há resultado para copiar');else copy(c.title+': '+o.textContent,b)}
  else if(d.cclear){delete S.cv[d.cclear];render()}
  else if(d.calcgo){S.cg='all';go('calc');document.getElementById(d.calcgo)?.scrollIntoView({block:'center'});document.querySelector('#'+d.calcgo+' input')?.focus({preventScroll:true})}
  else if('template' in d)template();
  else if(d.copy){const r=S.recs.find(x=>x.id===d.copy);copy([r.title,...(r.fields||[]).map(([k,v])=>k+': '+v),r.text].filter(Boolean).join('\n'),b)}
  else if(d.open)openFile(d.open);
  else if(d.del){const f=S.files.find(x=>x.id===d.del);if(f&&confirm(`Excluir "${f.name}" e seus registros?`)){await dbDel(f.id);S.favs=S.favs.filter(x=>!x.startsWith(f.id+':'));lset('pp.favs',S.favs);toast('Arquivo excluído');reload()}}
  else if('cancel' in d)closeDialog();
  else if('commit' in d)commit();
});
document.addEventListener('change',async e=>{const t=e.target,d=t.dataset;
  if(t.id==='file')prepare(t.files);else if(t.id==='restore')restoreBackup(t.files[0]);else if(d.pc)S.pending[d.pc].cat=t.value;else if(d.rep)S.pending[d.rep].replace=t.checked;
  else if(d.fc){const f=S.files.find(x=>x.id===d.fc);f.cat=t.value;await dbPut(f);reload()}
  else if(t.closest('[data-calc]'))runCalcs()});
document.addEventListener('input',e=>{if(e.target.closest('[data-calc]'))runCalcs()});
q.addEventListener('input',()=>{S.sf='all';render()});
kg.addEventListener('input',()=>{Object.values(S.cv).forEach(v=>delete v.peso);if(S.view==='calc'&&!q.value.trim()){const w=weight();view.querySelectorAll('[data-k=peso]').forEach(i=>i.value=w||'');runCalcs()}else render()});
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();q.focus();q.select()}else if(e.key==='Escape'&&document.activeElement===q){q.value='';render()}});
const hasFiles=e=>[...(e.dataTransfer?.types||[])].includes('Files');
addEventListener('dragover',e=>{if(hasFiles(e)){e.preventDefault();$('#drop').classList.add('on')}});
addEventListener('dragleave',e=>{if(!e.relatedTarget)$('#drop').classList.remove('on')});
addEventListener('drop',e=>{if(hasFiles(e)){e.preventDefault();$('#drop').classList.remove('on');S.cat='';prepare(e.dataTransfer.files)}});
if(desk){$('#upd').innerHTML=ic('sync',16);$('#upd').hidden=false;desk.onState(u=>{S.upd=u;if(S.updOpen)drawUpdates()})}
$('#logo').innerHTML=ic('pulse',22);$('#si').innerHTML=ic('search',16);$('#pi').innerHTML=ic('up',17);
render();reload();
</script>
</body>
</html>
