<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">

<title>Orvia</title>
<style>
:root{

}

  --screen:#081311;--screen-t:#6fe3bb;--screen-m:#7f9b91;

}
:root[data-theme="ceu"]{

  --screen:#0f1d33;--screen-t:#8fd0ff;--screen-m:#8fa3bf;--c1:#1f5fae;--c2:#a8551c;--c3:#0a6f56;--c4:#74508f;color-scheme:light;

}
:root[data-theme="noite"]{
  --bg:#0b1220;--panel:#111b2e;--inset:#18243b;--line:#26354f;--text:#e6edf7;--soft:#b9c6d8;--muted:#8a9ab2;
  --accent:#7cc4ff;--accent-t:#9ed3ff;--on-accent:#06172a;--tip:#13233d;--red:#ff8f8f;--amber:#f3c06b;--grid:rgb(124 196 255/.06);
  --screen:#070d18;--screen-t:#8fd0ff;--screen-m:#8a9ab2;--c1:#7cc4ff;--c2:#f0a35e;--c3:#6fdcb8;--c4:#c9a6f2;color-scheme:dark;

}
:root[data-theme="grafite"]{

  --screen:#0a0a0a;--screen-t:#f6c66b;--screen-m:#9a9a9a;--c1:#f2b544;--c2:#6fb6f0;--c3:#74d4a8;--c4:#d39cf0;color-scheme:dark;
  --bar-t:#b8b8b8;--bar-m:#949494;--bar-line:#2e2e2e;--bar-hover:#222;--warn-s:#ff9d5c;--scrim:0 0 0;
}
:root[data-theme="noturno"]{
  --bg:#110d09;--panel:#19130d;--inset:#221a12;--line:#3a2c1f;--text:#f0dcc2;--soft:#cdb594;--muted:#a69072;
  --accent:#ffa94d;--accent-t:#ffbb73;--on-accent:#2a1500;--tip:#2a1e12;--red:#ff8f6b;--amber:#ffc46b;--grid:rgb(255 169 77/.05);
  --screen:#0b0805;--screen-t:#ffbb73;--screen-m:#a69072;--c1:#ffa94d;--c2:#e8c36a;--c3:#d98f6a;--c4:#c9a27e;color-scheme:dark;
  --bar-t:#c9b08e;--bar-m:#a08a6c;--bar-line:#33261a;--bar-hover:#21180f;--bar-on:#f0dcc2;--warn-s:#ff8f6b;--scrim:8 5 2;
}
:root[data-theme="contraste"]{
  --bg:#000;--panel:#000;--inset:#161616;--line:#a3a3a3;--text:#fff;--soft:#fff;--muted:#d6d6d6;
  --accent:#ffe14d;--accent-t:#ffe14d;--on-accent:#000;--tip:#1a1a1a;--red:#ff8080;--amber:#ffe14d;--grid:transparent;
  --screen:#000;--screen-t:#ffe14d;--screen-m:#d6d6d6;--c1:#ffe14d;--c2:#ff9d5c;--c3:#66e0ff;--c4:#e6a6ff;color-scheme:dark;
  --bar-t:#fff;--bar-m:#d6d6d6;--bar-line:#a3a3a3;--bar-hover:#262626;--warn-s:#ff9d5c;--scrim:0 0 0;--screen-line:#a3a3a3;

/* Grade de 8 pontos: espaços e alturas em múltiplos de 8, com meio passo de 4 só para ajuste fino.
   Alturas de linha seguem a linha de base de 4. */
:root[data-theme="contraste"] .side,:root[data-theme="contraste"] .top{border-bottom:1px solid var(--line)}
:root[data-theme="contraste"] .nav button.on,:root[data-theme="contraste"] .chip.on{text-decoration:underline;text-underline-offset:4px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:var(--t-body) "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
input[type=checkbox]{margin:0}
svg{display:block;flex:none}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--head);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.side{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:var(--s3);height:var(--s7);padding:0 max(var(--s3),calc((100% - 1312px)/2));background:var(--bar);color:var(--bar-on)}

#nav2{margin-left:auto}
.nav button{position:relative;display:flex;align-items:center;gap:var(--s1);padding:0 var(--s1-5);color:var(--bar-t);font-size:14px;line-height:20px;font-weight:500;white-space:nowrap}
.nav button svg{width:16px;height:16px}
.nav button:hover{color:var(--bar-on)}
.nav button.on{color:var(--bar-on);font-weight:600}
.nav button.on::after{content:"";position:absolute;left:var(--s1-5);right:var(--s1-5);bottom:0;height:var(--s-half);background:var(--screen-t)}
.nav button.on svg{color:var(--screen-t)}
.nav .n{font:var(--t-xs) var(--mono);color:var(--bar-m)}
.nav .n:empty{display:none}
.side-end{flex:none;display:flex;align-items:center;gap:var(--s1)}
.theme{display:flex;align-items:center}.theme>span{display:none}
.updb{width:var(--h-s);height:var(--h-s);display:grid;place-items:center;border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--bar-line);color:var(--bar-t)}
.updb:hover{color:var(--bar-on);background:var(--bar-hover)}.updb[hidden]{display:none}
.seg{display:flex;border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--bar-line);overflow:hidden}
.seg button{width:var(--h-s);height:var(--h-s);display:grid;place-items:center;color:var(--bar-t)}
.seg button.on{background:var(--bar-hover);color:var(--bar-on)}
.seg button:hover{color:var(--bar-on)}
.bar{height:var(--s1);margin-top:var(--s2);background:var(--inset);border-radius:var(--r1);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.content{min-width:0}
#view{display:block;max-width:1360px;margin:0 auto;padding:0 var(--s3) var(--s6)}
.top{position:sticky;top:var(--s7);z-index:7;display:flex;align-items:center;gap:var(--s1);margin:0 0 var(--s4);padding:var(--s2) max(var(--s3),calc((100% - 1312px)/2));background-color:var(--panel);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:var(--s1) var(--s1);border-bottom:1px solid var(--line)}
.top h1{font-size:24px;line-height:32px;margin-right:auto;white-space:nowrap}

.ctl{display:flex;align-items:center;gap:var(--s1);height:var(--h-m);background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:0 var(--s1-5);color:var(--muted)}
.ctl:focus-within{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ctl input{border:0;outline:0;padding:0;background:none;color:var(--text);min-width:0}
.ctl.s input{width:320px}.ctl.w input{width:var(--s7);font:600 var(--t-m) var(--mono)}
.ctl input::-webkit-inner-spin-button{display:none}
.kbd{font:var(--t-xs) var(--mono);color:var(--muted);white-space:nowrap}
.pri,.sec{display:inline-flex;align-items:center;justify-content:center;gap:var(--s1);border-radius:var(--r2);font-weight:600;white-space:nowrap}
.pri{height:var(--h-m);padding:0 var(--s2);background:var(--accent);color:var(--on-accent)}
.pri:hover{filter:brightness(1.08)}
.sec{height:var(--h-s);padding:0 var(--s1-5);border:1px solid var(--line);font-size:14px;line-height:20px}

.icon{width:var(--h-s);height:var(--h-s);display:inline-grid;place-items:center;border:1px solid var(--line);border-radius:var(--r2);color:var(--soft)}
.icon:hover{background:var(--inset)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2)}
.card{padding:var(--s3);min-width:0}
.home{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--s5) var(--s4)}
.block{min-width:0;border-top:2px solid var(--text);padding-top:var(--s2)}
.lib{grid-column:span 8}.dosebox{grid-column:span 4}.tri{grid-column:span 4}
.bh{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s2);margin-bottom:var(--s2)}
.bh h2{font-size:18px;line-height:var(--s3)}
.leg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 var(--s4)}
.idx{display:grid;grid-template-columns:var(--s3) minmax(0,1fr) auto;align-items:center;gap:var(--s1);width:100%;padding:var(--s1-5) 0;border-bottom:1px solid var(--line);text-align:left;font-weight:600}
.idx svg{color:var(--k)}
.idx b{font:600 24px/24px var(--mono)}
.idx:hover span{color:var(--accent-t);text-decoration:underline;text-underline-offset:4px}
.dropc{display:flex;align-items:center;gap:var(--s2);width:100%;margin-top:var(--s2);padding:var(--s2);border:1px dashed var(--muted);border-radius:var(--r2);text-align:left;color:var(--muted)}
.dropc:hover{border-color:var(--accent)}.dropc svg{color:var(--accent-t)}.dropc b{display:block;color:var(--text)}
.screen,.out,.res{border:1px solid var(--screen-line)}
.screen{background:var(--screen);border-radius:var(--r2);padding:var(--s2);color:var(--screen-t);font-family:var(--mono);font-variant-ligatures:none}
.screen>b{display:block;font-size:32px;line-height:var(--s5);font-weight:600}
.screen>b i{font-style:normal;font-size:16px;color:var(--screen-m);margin-left:var(--s1)}
.screen>small{display:block;color:var(--screen-m);font-size:12px;line-height:16px;margin-top:var(--s-half)}
.vals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2);margin-top:var(--s2);padding-top:var(--s1);border-top:1px solid color-mix(in srgb,var(--screen-m) 35%,transparent)}
.vals span{display:block;color:var(--screen-m);font-size:12px;line-height:16px}.vals b{font-size:16px;line-height:var(--s3)}
.note{margin-top:var(--s1);font-size:14px;line-height:20px;color:var(--muted)}
.link{color:var(--accent-t);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.rows{display:flex;flex-direction:column}
.ri{display:flex;align-items:center;gap:var(--s1);width:100%;padding:var(--s1) 0;border-bottom:1px solid var(--line);text-align:left}
.ri>span{min-width:0;flex:1}.ri b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri small{display:block;color:var(--muted);font-size:13px;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri>svg{color:var(--muted)}.ri:hover b{color:var(--accent-t)}
.more{margin-top:var(--s2)}
.sub{color:var(--muted);font-size:14px;line-height:20px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s2);margin-bottom:var(--s2);flex-wrap:wrap}.head p{color:var(--muted)}
.hbtn{display:flex;gap:var(--s1);flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,384px),1fr));gap:var(--s2);align-items:start}
.lim{margin-top:var(--s2)}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s2)}
.rec{padding:var(--s2)}
.rec h3{font-size:18px;line-height:var(--s3);overflow-wrap:anywhere}
.acts{display:flex;align-items:center;gap:var(--s-half);flex:none}
.star{width:var(--h-s);height:var(--h-s);display:grid;place-items:center;border-radius:var(--r2);color:var(--muted)}
.star:hover{background:var(--inset)}.star.on{color:var(--amber)}.star.on path{fill:currentColor}

.dot{width:var(--s1);height:var(--s1);flex:none}
dl{margin:var(--s2) 0 0}dl div{padding:var(--s1) 0;border-top:1px solid var(--line)}
dt{font-size:12px;line-height:16px;color:var(--muted)}dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.res{background:var(--screen);color:var(--screen-t);border-radius:var(--r2);padding:var(--s1-5) var(--s2);margin-top:var(--s2);font-family:var(--mono)}
.res small{display:block;color:var(--screen-m);font-size:12px;line-height:16px}
.res b{font-size:16px;line-height:var(--s3);font-weight:600}.res em{display:block;font-style:normal;font-size:12px;line-height:16px;color:var(--warn-s)}
.body{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:var(--s2);color:var(--soft);font-size:14px;line-height:20px}
details summary{cursor:pointer;color:var(--accent-t);font-weight:600;font-size:14px;line-height:20px;margin-top:var(--s1)}
.rf,.ca{display:flex;gap:var(--s1);margin-top:var(--s2)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:var(--s2) var(--s1-5);margin-top:var(--s2)}
label{font-size:13px;line-height:20px;color:var(--muted)}
.form input,.form select,select.sel{display:block;width:100%;height:var(--h-m);margin-top:var(--s-half);padding:0 var(--s1);background:var(--inset);border:1px solid var(--line);border-radius:var(--r2);color:var(--text)}
select option{background:var(--panel)}
[data-calc=c-glasgow] label,[data-calc=c-cha] label:has(select){grid-column:1/-1}
.form .ck{grid-column:1/-1;display:flex;align-items:center;gap:var(--s1);color:var(--soft);font-size:14px;line-height:20px}
.form .ck input{width:var(--s2);height:var(--s2);margin:0;flex:none;accent-color:var(--accent)}
.out{display:flex;align-items:center;background:var(--screen);color:var(--screen-t);border-radius:var(--r2);padding:var(--s2);margin-top:var(--s2);font:600 18px/24px var(--mono);min-height:var(--s7)}
.out.w{font:400 14px/20px "Segoe UI",system-ui,sans-serif;color:var(--screen-m)}

.ft{display:grid;grid-template-columns:var(--s6) minmax(0,1fr) 152px 88px 104px;align-items:center;gap:var(--s2);padding:var(--s1-5) 0;border-top:1px solid var(--line)}
.ft:first-child{border-top:0}.ft b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ft small{color:var(--muted);font-size:13px;line-height:20px}

.flist{padding:var(--s1) var(--s3)}
.ext{width:var(--s6);height:var(--h-s);border:1px solid var(--line);border-radius:var(--r1);color:var(--soft);font:600 var(--t-xs) var(--mono);display:grid;place-items:center}
.empty{display:flex;flex-direction:column;align-items:center;gap:var(--s2);text-align:center;padding:var(--s6) var(--s3);color:var(--muted)}.empty b{font:600 18px/24px var(--head);color:var(--text)}.empty .pri{margin-top:var(--s1)}
.emark{color:var(--accent-t)}

dialog h2{font-size:20px;line-height:28px}

.ii b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ii small{display:block;color:var(--muted);font-size:13px;line-height:20px}.ii .bad{color:var(--red)}

.da{display:flex;justify-content:flex-end;gap:var(--s1)}.da .sec,.sec.m{height:var(--h-m)}

.err{color:var(--red);font-size:14px;line-height:20px;min-height:20px}

<body>

</aside>
<div class="content">
  <header class="top">
    <h1 id="title"></h1>
    <label class="ctl s"><span id="si"></span><input id="q" type="search" placeholder="Buscar medicamento, conduta, cálculo" aria-label="Buscar" autocomplete="off"><span class="kbd">Ctrl K</span></label>
    <label class="ctl w"><input id="kg" type="number" min="0.3" max="300" step="0.1" inputmode="decimal" placeholder="Peso" aria-label="Peso do paciente em quilos"><span>kg</span></label>
    <button class="pri" data-import=""><span id="pi"></span>Importar</button>

  <main id="view"></main>
</div>
<input id="file" type="file" multiple hidden accept=".csv,.tsv,.xlsx,.json,.txt,.md,.docx,.pdf,.png,.jpg,.jpeg,.webp">

<div id="toast" role="status"></div>

<script>
const P={grid:'<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',pill:'<path d="m10.5 20.5 10-10a5 5 0 0 0-7-7l-10 10a5 5 0 0 0 7 7ZM8.5 8.5l7 7"/>',rx:'<path d="M6 2h9l4 4v16H6zM14 2v5h5M9 13h7M9 17h7"/>',clip:'<path d="M9 3h6v4H9zM9 5H5v17h14V5h-4M9 13h6M9 17h6"/>',box:'<path d="M3 6h6l2 3h10v11H3z"/>',calc:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8.5 6h7M8.5 11h.01M12 11h.01M15.5 11h.01M8.5 14.5h.01M12 14.5h.01M15.5 14.5h.01M8.5 18h.01M12 18h.01M15.5 18h.01"/>',star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2-5.5-2.9-5.5 2.9 1-6.2L3 9.6l6.2-.9z"/>',up:'<path d="M12 16V4M7 9l5-5 5 5M4 16v4h16v-4"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/>',moon:'<path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z"/>',pulse:'<path d="M3 12h4l2-6 4 12 2-6h6"/>',scale:'<path d="M5 4h14l2 16H3zM9 9a3 3 0 0 1 6 0"/>',bulb:'<path d="M9 18h6M10 21h4M8 14a6 6 0 1 1 8 0c-1 1-1 2-1 2H9s0-1-1-2z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/>',open:'<path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/>',left:'<path d="m15 5-7 7 7 7"/>',right:'<path d="m9 5 7 7-7 7"/>',down:'<path d="M12 4v12M7 11l5 5 5-5M4 20h16"/>',plus:'<path d="M12 5v14M5 12h14"/>',palette:'<path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.3-1.7-.4-1.1.3-2.3 1.5-2.3H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/>',sync:'<path d="M20 11a8 8 0 0 0-14-4L4 9M4 4v5h5M4 13a8 8 0 0 0 14 4l2-2M20 20v-5h-5"/>'};
const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const CATS={doses:['Doses','pill','var(--c1)'],prescricoes:['Prescrições','rx','var(--c2)'],protocolos:['Protocolos','clip','var(--c3)'],outros:['Outros','box','var(--c4)']};
const CK=Object.keys(CATS);
const CG={all:'Todas',renal:'Renal e eletrólitos',fluidos:'Infusão e fluidos',clinica:'Clínica geral',escores:'Escores'};
const THEMES=[
 ['system','Automático','Segue o Windows',['linear-gradient(135deg,#f4f1e9 50%,#0c1716 50%)','#fbf9f3','#0a6f56','#4fd1a5']],
 ['dark','Petróleo','Escuro padrão',['#0c1716','#12201e','#4fd1a5','#081311']],
 ['light','Papel','Claro padrão',['#f4f1e9','#fbf9f3','#0a6f56','#10231f']],
 ['ceu','Céu','Claro azulado',['#eef3f8','#fbfdff','#1f5fae','#0f1d33']],
 ['noite','Noite azul','Escuro azulado',['#0b1220','#111b2e','#7cc4ff','#070d18']],
 ['grafite','Grafite','Escuro neutro',['#121212','#1b1b1b','#f2b544','#0a0a0a']],
 ['noturno','Plantão noturno','Quente, com pouca luz azul',['#110d09','#19130d','#ffa94d','#0b0805']],
 ['contraste','Alto contraste','Leitura máxima',['#000','#000','#ffe14d','#fff']]
].map(([id,name,desc,p])=>({id,name,desc,p}));
const SCHEME=matchMedia('(prefers-color-scheme: dark)');
const applyTheme=()=>{const t=THEMES.some(x=>x.id===S.theme)?S.theme:'dark';document.documentElement.dataset.theme=t==='system'?(SCHEME.matches?'dark':'light'):t};
function drawThemes(){dlg.innerHTML=`<h2 id="dt">Aparência</h2><p class="sub">A escolha fica salva neste computador.</p><div class="themes">${THEMES.map(t=>`<button class="tcard ${S.theme===t.id?'on':''}" data-theme-set="${t.id}" aria-pressed="${S.theme===t.id}"><span class="tprev" style="background:${t.p[0]}"><i style="background:${t.p[1]}"></i><i style="background:${t.p[2]}"></i><i style="background:${t.p[3]}"></i></span><b>${t.name}</b><small>${t.desc}</small></button>`).join('')}</div><div class="da"><button class="sec" data-cancel>Fechar</button></div>`}
const SEXO=['Masculino','Feminino'];
const points=v=>Object.values(v).reduce((s,x)=>s+(parseInt(x,10)||0),0);
const pts=n=>plural(n,'ponto','pontos');
const CALCS=[
 {id:'c-clcr',g:'renal',title:'Clearance de creatinina',alias:'cockcroft gault função renal',desc:'Cockcroft-Gault',f:[['idade','Idade (anos)'],['peso','Peso (kg)'],['cr','Creatinina (mg/dL)'],['sexo','Sexo',['Masculino','Feminino']]],run:v=>fmt((140-v.idade)*v.peso/(72*v.cr)*(v.sexo==='Feminino'?.85:1))+' mL/min'},
 {id:'c-inf',g:'fluidos',title:'Infusão contínua',alias:'bomba vasopressor mcg kg min ml h',desc:'mcg/kg/min para mL/h',f:[['dose','Dose (mcg/kg/min)'],['peso','Peso (kg)'],['mg','Droga na solução (mg)'],['vol','Volume total (mL)']],run:v=>fmt(v.dose*v.peso*60*v.vol/(v.mg*1000))+' mL/h'},
 {id:'c-holliday',g:'fluidos',title:'Holliday-Segar',alias:'manutenção hidratação pediatria soro',desc:'Manutenção hídrica',f:[['peso','Peso (kg)']],run:v=>{const d=holliday(v.peso);return fmt(d)+' mL/dia · '+fmt(d/24)+' mL/h'}},
 {id:'c-ag',g:'renal',title:'Ânion gap',alias:'acidose metabólica gasometria',desc:'Na − (Cl + HCO₃)',f:[['na','Sódio (mEq/L)'],['cl','Cloro (mEq/L)'],['hco','Bicarbonato (mEq/L)']],run:v=>fmt(v.na-v.cl-v.hco)+' mEq/L'},
 {id:'c-na',g:'renal',title:'Sódio corrigido',alias:'hiperglicemia cetoacidose hiponatremia',desc:'Na + 1,6 × (glicose − 100) / 100',f:[['na','Sódio (mEq/L)'],['gli','Glicose (mg/dL)']],run:v=>fmt(v.na+1.6*(v.gli-100)/100)+' mEq/L'},
 {id:'c-ckdepi',g:'renal',title:'TFG estimada',alias:'ckd-epi 2021 filtração glomerular função renal',desc:'CKD-EPI 2021, adultos',f:[['idade','Idade (anos)'],['cr','Creatinina (mg/dL)'],['sexo','Sexo',SEXO]],run:v=>{if(v.idade<18)return null;const f=v.sexo==='Feminino',k=f?.7:.9,r=v.cr/k;return fmt(142*Math.min(r,1)**(f?-.241:-.302)*Math.max(r,1)**-1.2*.9938**v.idade*(f?1.012:1))+' mL/min/1,73 m²'}},
 {id:'c-agalb',g:'renal',title:'Ânion gap corrigido',alias:'albumina acidose metabólica gasometria',desc:'AG + 2,5 × (4 − albumina)',f:[['na','Sódio (mEq/L)'],['cl','Cloro (mEq/L)'],['hco','Bicarbonato (mEq/L)'],['alb','Albumina (g/dL)']],run:v=>fmt(v.na-v.cl-v.hco+2.5*(4-v.alb))+' mEq/L'},
 {id:'c-osm',g:'renal',title:'Osmolaridade sérica',alias:'osmolalidade sódio glicose ureia',desc:'2 × Na + glicose/18 + ureia/6',f:[['na','Sódio (mEq/L)'],['gli','Glicose (mg/dL)'],['ur','Ureia (mg/dL)']],run:v=>fmt(2*v.na+v.gli/18+v.ur/6)+' mOsm/L'},
 {id:'c-ca',g:'renal',title:'Cálcio corrigido',alias:'albumina hipocalcemia hipercalcemia',desc:'Ca + 0,8 × (4 − albumina)',f:[['ca','Cálcio total (mg/dL)'],['alb','Albumina (g/dL)']],run:v=>fmt(v.ca+.8*(4-v.alb))+' mg/dL'},
 {id:'c-agua',g:'renal',title:'Déficit de água livre',alias:'hipernatremia desidratação sódio',desc:'Água corporal × (Na/140 − 1)',f:[['peso','Peso (kg)'],['na','Sódio (mEq/L)'],['sexo','Sexo',SEXO]],run:v=>v.na<=140?null:fmt((v.sexo==='Feminino'?.5:.6)*v.peso*(v.na/140-1))+' L'},
 {id:'c-gota',g:'fluidos',title:'Gotejamento',alias:'soro gotas microgotas velocidade infusão',desc:'Gotas e microgotas por minuto',f:[['vol','Volume (mL)'],['h','Tempo (horas)']],run:v=>fmt(v.vol/(v.h*3))+' gotas/min · '+fmt(v.vol/v.h)+' microgotas/min'},
 {id:'c-parkland',g:'fluidos',title:'Parkland',alias:'queimadura queimado reposição volêmica',desc:'4 mL × kg × % de superfície queimada',f:[['peso','Peso (kg)'],['scq','Superfície queimada (%)']],run:v=>{if(v.scq>100)return null;const d=4*v.peso*v.scq;return fmt(d)+' mL em 24 h · '+fmt(d/16)+' mL/h nas primeiras 8 h'}},
 {id:'c-imc',g:'clinica',title:'IMC',alias:'índice de massa corporal obesidade peso altura',desc:'Peso / altura²',f:[['peso','Peso (kg)'],['alt','Altura (cm)']],run:v=>fmt(v.peso/(v.alt/100)**2)+' kg/m²'},
 {id:'c-sc',g:'clinica',title:'Superfície corporal',alias:'mosteller sc quimioterapia',desc:'Mosteller',f:[['peso','Peso (kg)'],['alt','Altura (cm)']],run:v=>fmt(Math.sqrt(v.peso*v.alt/3600))+' m²'},
 {id:'c-pam',g:'clinica',title:'Pressão arterial média',alias:'pam hemodinâmica choque',desc:'(PAS + 2 × PAD) / 3',f:[['pas','PAS (mmHg)'],['pad','PAD (mmHg)']],run:v=>v.pad>v.pas?null:fmt((v.pas+2*v.pad)/3)+' mmHg'},
 {id:'c-qtc',g:'clinica',title:'QT corrigido',alias:'qtc bazett ecg eletrocardiograma',desc:'Bazett',f:[['qt','QT (ms)'],['fc','Frequência cardíaca (bpm)']],run:v=>fmt(v.qt/Math.sqrt(60/v.fc))+' ms'},
 {id:'c-pf',g:'clinica',title:'Relação PaO₂/FiO₂',alias:'pf sdra oxigenação gasometria ventilação',desc:'PaO₂ / fração inspirada de O₂',f:[['pao','PaO₂ (mmHg)'],['fio','FiO₂ (%)']],run:v=>v.fio>100||v.fio<21?null:fmt(v.pao/(v.fio/100))+' mmHg'},
 {id:'c-glasgow',g:'escores',title:'Escala de Glasgow',alias:'coma nível de consciência neurológico trauma',desc:'Abertura ocular, resposta verbal e motora',f:[['o','Abertura ocular',['4 · Espontânea','3 · Ao chamado','2 · À pressão','1 · Ausente']],['v','Resposta verbal',['5 · Orientada','4 · Confusa','3 · Palavras','2 · Sons','1 · Ausente']],['m','Resposta motora',['6 · Obedece comandos','5 · Localiza','4 · Flexão normal','3 · Flexão anormal','2 · Extensão','1 · Ausente']]],run:v=>{const n=points(v);return pts(n)+' · '+(n>=13?'leve':n>=9?'moderado':'grave')}},

  const H=clean[0].map((h,i)=>h||'Coluna '+(i+1)),K=H.map(key);

  return clean.slice(1).map((r,n)=>{
    const rec={title:r[ti]||'Linha '+(n+2),fields:H.map((h,i)=>[h,r[i]||'',i]).filter(x=>x[2]!==ti&&x[1]).map(x=>[x[0],x[1]])};

/* Leitor de capítulos em PDF */
const MAX_PAGES=600,SHOW=300;
// Número (ou faixa) seguido de unidade de dose, com divisões como /kg/min; e intervalos como 6/6 h.
const DOSE=/\d+(?:[.,]\d+)?(?:\s*(?:-|–|a|até)\s*\d+(?:[.,]\d+)?)?\s*(?:mcg|µg|μg|mg|ng|g|UI|unidades?|U|mEq|mmol|mL|ml|litros?|L|gotas?|gts|microgotas|ampolas?|amp|comprimidos?|comp|cp|frascos?|%)(?:\s*\/\s*(?:kg|m²|m2|h|hora|min|dia|dose))*(?![\p{L}\d])|\d+\s*\/\s*\d+\s*h(?![\p{L}\d])/giu;
const DOSE1=new RegExp(DOSE.source,'iu'),NEWDRUG=/^\p{Lu}\p{Ll}{2,}/u;
const VERB=/^(?:diluir|dose|doses|administrar|fazer|iniciar|manter|repetir|infundir|ataque|manutenção|bolus|em|de|até|a|e|ou)$/i;
const markDose=t=>{let out='',i=0;for(const m of t.matchAll(DOSE)){out+=esc(t.slice(i,m.index))+'<mark>'+esc(m[0])+'</mark>';i=m.index+m[0].length}return out+esc(t.slice(i))};
function pageLines(items){
  const out=[];let cur='',y=null;const push=()=>{const s=cur.replace(/\s+/g,' ').trim();if(s)out.push(s);cur=''};
  for(const it of items){
    if(typeof it.str!=='string')continue;const iy=it.transform?.[5];
    if(cur.trim()&&y!=null&&iy!=null&&Math.abs(iy-y)>Math.max(2,(it.height||10)/2))push();
    cur+=it.str;if(it.str.trim())y=iy??y;if(it.hasEOL)push();
  }
  push();
  // Junta palavras hifenizadas na quebra de linha, como "adminis-" + "tração".
  for(let i=0;i<out.length-1;i++)if(/\p{L}-$/u.test(out[i])&&/^\p{Ll}/u.test(out[i+1])){out[i]=out[i].slice(0,-1)+out[i+1];out.splice(i+1,1);i--}
  return out;
}
function drugGuess(t,prev){
  const cut=t.search(/\d/);let g=(cut<0?t:t.slice(0,cut)).replace(/[\s:;,.(–-]+$/,'').trim();
  if(g.length<3||VERB.test(g.split(/\s+/)[0]))g=prev&&prev.length<=60&&!/\d/.test(prev)?prev.replace(/[\s:;,.]+$/,''):'';
  // Começo em minúscula é meio de frase, não nome de medicamento.
  return /^\p{Lu}/u.test(g)?g.split(/\s+/).slice(0,6).join(' ').slice(0,80):'';
}
const chapHead=s=>`<h2 id="dt">Ler capítulo</h2><p class="sub" id="chp">${s}</p>`;
function chapFail(run,name,m){
  if(S.chapRun!==run)return;S.chapRun=null;
  dlg.innerHTML=chapHead(esc(name))+`<p class="err" role="alert">${esc(m)}</p><div class="da"><button class="sec" data-cancel>Fechar</button><button class="pri" data-chapter>Escolher outro PDF</button></div>`;
}
async function readChapter(blob,name){
  const run=S.chapRun={};S.chap=null;S.edit=null;dlg.dataset.size='l';
  dlg.innerHTML=chapHead(`Lendo ${esc(name)}…`)+'<div class="da"><button class="sec" data-cancel>Cancelar</button></div>';if(!dlg.open)dlg.showModal();
  const fail=m=>chapFail(run,name,m);
  if(!/\.pdf$/i.test(name))return fail('Escolha um arquivo PDF.');
  if(!blob.size)return fail('O arquivo está vazio.');
  if(blob.size>MAX_MB*1048576)return fail('O PDF é maior que '+MAX_MB+' MB.');
  // O pdf.js entra como módulo no build e só existe depois que a página termina de carregar.
  if(document.readyState!=='complete')await new Promise(r=>addEventListener('load',r,{once:true}));
  const lib=globalThis.pdfjsLib;
  if(!lib)return fail('O leitor de PDF não está nesta cópia do Orvia. Use o arquivo gerado pelo build ou o programa instalado.');
  let task;
  try{
    task=lib.getDocument({data:new Uint8Array(await blob.arrayBuffer()),isEvalSupported:false,disableFontFace:true,useSystemFonts:false,enableXfa:false,verbosity:0});
    const pdf=await task.promise,n=Math.min(pdf.numPages,MAX_PAGES),lines=[];let chars=0;
    for(let p=1;p<=n;p++){
      if(S.chapRun!==run)return;
      $('#chp').textContent=`Lendo ${name}… página ${p} de ${n}`;
      const page=await pdf.getPage(p),ls=pageLines((await page.getTextContent()).items);page.cleanup();
      ls.forEach((t,i)=>{chars+=t.length;lines.push({p,t,prev:ls[i-1]||'',dose:DOSE1.test(t)})});
    }
    if(S.chapRun!==run)return;
    if(!chars)return fail('Este PDF não tem texto selecionável. Ele parece digitalizado, e o leitor não reconhece texto em imagens.');
    S.chapRun=null;
    S.chap={name,fonte:name.replace(/\.pdf$/i,''),pages:n,total:pdf.numPages,lines,sel:new Set(),all:false,join:true,filter:'',dest:''};
    drawChapter();
  }catch(e){fail(e?.name==='PasswordException'?'Este PDF é protegido por senha. Remova a proteção e tente de novo.':'Não foi possível ler este PDF. O arquivo pode estar corrompido.')}
  finally{task?.destroy()}
}
function chapRows(){
  const c=S.chap,f=norm(c.filter).trim();
  return c.lines.map((l,i)=>[l,i]).filter(([l])=>(c.all||l.dose)&&(!f||norm(l.t+' '+l.prev).includes(f)));
}
function drawChapList(){
  const c=S.chap,v=chapRows(),shown=v.slice(0,SHOW);
  $('#chl').innerHTML=shown.length?shown.map(([l,i])=>`<label class="chr"><input type="checkbox" data-chs="${i}" ${c.sel.has(i)?'checked':''}><span class="tag">p. ${l.p}</span><span class="cht">${l.prev?`<small>${esc(l.prev)}</small>`:''}<span>${markDose(l.t)}</span></span></label>`).join(''):'<p class="sub chn">Nenhum trecho com esse filtro.</p>';
  $('#chc').textContent=plural(v.length,'trecho','trechos')+(v.length>SHOW?` · mostrando ${SHOW}, refine com o filtro`:'');
  drawChapCount();
}
function drawChapCount(){const n=S.chap.sel.size;if(n)$('#che').textContent='';$('[data-chtake]').textContent=n?`Levar ${plural(n,'trecho','trechos')}`:'Levar trechos'}
function drawChapter(){
  const c=S.chap,doses=c.lines.filter(l=>l.dose).length;
  dlg.innerHTML=chapHead(`${esc(c.name)} · ${plural(c.pages,'página','páginas')}${c.total>c.pages?` de ${c.total.toLocaleString('pt-BR')}, limite do leitor`:''} · ${plural(doses,'trecho com dose','trechos com dose')}`)+
  `<div class="stackf chf"><label>Fonte para a referência<input id="chf" maxlength="120" value="${esc(c.fonte)}" autocomplete="off"></label><label>Levar para<select id="chd"><option value="">Novo cenário</option>${byTitle(S.cens).map(x=>`<option value="${esc(x.id)}" ${x.id===c.dest?'selected':''}>${esc(x.title)}</option>`).join('')}</select></label></div>`+
  `<div class="chbar"><div class="stackf"><label>Filtrar trechos<input id="chq" type="search" value="${esc(c.filter)}" autocomplete="off" placeholder="Medicamento ou termo"></label></div><label class="chk"><input type="checkbox" id="cha" ${c.all?'checked':''}>Mostrar todas as linhas</label><label class="chk"><input type="checkbox" id="chj" ${c.join?'checked':''}>Juntar linhas próximas no mesmo medicamento</label></div>`+
  `<div class="chbar"><p class="sub" id="chc" role="status"></p><div class="hbtn"><button class="sec" data-chall>Selecionar visíveis</button><button class="sec" data-chnone>Limpar seleção</button></div></div><div class="chl" id="chl"></div>`+
  `<p class="err" id="che" role="alert"></p><div class="priv">O filtro procura números com unidade de dose e não entende o texto. Confira cada trecho no original antes de usar. O PDF não é guardado, só os trechos que você levar.</div><div class="da"><button class="sec" data-cancel>Cancelar</button><button class="pri" data-chtake>Levar trechos</button></div>`;
  drawChapList();
}
function takeChapter(){
  const c=S.chap;if(!c.sel.size){$('#che').textContent='Selecione ao menos um trecho.';return}
  const fonte=c.fonte.trim()||c.name,dest=S.cens.find(x=>x.id===c.dest);
  // Em tabelas, uma célula vira várias linhas: trechos próximos da mesma página formam um item,
  // com as linhas entre eles, até uma linha que comece por nome próprio, como "Droga Beta".
  const groups=[];
  for(const i of [...c.sel].sort((a,b)=>a-b)){const g=groups.at(-1),l=c.lines[i];if(c.join&&g&&c.lines[g.end].p===l.p&&i-g.end<=3&&!NEWDRUG.test(l.t))g.end=i;else groups.push({start:i,end:i})}
  // Quem filtrou por um nome, como "noradrenalina", procura esse medicamento: ele vira o nome do item.
  const term=c.filter.trim().replace(/\s+/g,' '),tn=norm(term);
  const items=groups.map(({start,end})=>{
    const ls=c.lines.slice(start,end+1),l=ls[0],text=ls.map(x=>x.t).join(' '),g=drugGuess(l.t,l.prev);
    const droga=tn&&norm(text).includes(tn)&&!norm(g).includes(tn)?term[0].toUpperCase()+term.slice(1):g;
    return{...blankRx(),droga,posologia:text,ref:`${fonte}, p. ${l.p}`};
  });
  S.chap=null;delete dlg.dataset.size;
  openCenEdit(dest?.id||null,{title:fonte,items});
}

/* Backup */
function saveAs(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000)}
async function toB64(blob){const b=new Uint8Array(await blob.arrayBuffer()),out=[];for(let i=0;i<b.length;i+=32766)out.push(btoa(String.fromCharCode(...b.subarray(i,i+32766))));return out.join('')}
function fromB64(s){const t=atob(s),b=new Uint8Array(t.length);for(let i=0;i<t.length;i++)b[i]=t.charCodeAt(i);return b}
async function exportBackup(){
  if(!S.files.length&&!S.cens.length)return toast('Ainda não há arquivos nem cenários para exportar');
  if(S.files.reduce((s,f)=>s+f.size,0)*4/3>MAX_BACKUP_MB*1048576)return toast('A biblioteca passa do limite de '+MAX_BACKUP_MB+' MB do backup');
  try{
    const parts=['{"app":"painel-plantao","versao":1,"favs":',JSON.stringify(S.favs),',"cenarios":',JSON.stringify(S.cens),',"files":['];
    for(const[i,f]of S.files.entries()){const{blob,...meta}=f;parts.push((i?',':'')+JSON.stringify({...meta,data:await toB64(blob)}))}
    parts.push(']}');saveAs(new Blob(parts,{type:'application/json'}),'orvia-backup-'+new Date().toLocaleDateString('sv')+'.json');toast('Backup exportado');
  }catch{toast('Não foi possível gerar o backup')}
}
const bad=()=>{throw Error('Backup inválido')};
const optNum=x=>x==null||Number.isFinite(x);
function cleanRec(r){
  if(typeof r?.title!=='string'||!r.title)bad();const o={title:r.title};if(r.doc===true)o.doc=true;
  if(r.text!=null){if(typeof r.text!=='string')bad();o.text=r.text}
  if(r.fields!=null){if(!Array.isArray(r.fields)||!r.fields.every(f=>Array.isArray(f)&&f.length===2&&f.every(x=>typeof x==='string')))bad();o.fields=r.fields}
  if(r.calc!=null){const c=r.calc;if(!Number.isFinite(c.a)||!Number.isFinite(c.b)||!(c.a>0&&c.b>=c.a)||typeof c.u!=='string'||![c.cap,c.fl,c.c,c.d].every(optNum))bad();o.calc={a:c.a,b:c.b,cap:c.cap??null,fl:c.fl??null,u:c.u,c:c.c??null,d:c.d??null}}
  return o;
}
function cleanFile(f){
  const ext=typeof f?.name==='string'?extOf(f.name):'';if(!Object.hasOwn(FT,ext)||!Object.hasOwn(CATS,f.cat)||typeof f.data!=='string'||!Array.isArray(f.recs)||!f.recs.length)bad();
  const bytes=fromB64(f.data);return{old:String(f.id),file:{id:newId(),name:f.name,ext,size:bytes.length,cat:f.cat,at:Number.isFinite(f.at)?f.at:Date.now(),recs:f.recs.map(cleanRec),blob:new Blob([bytes])}};
}
const optStr=x=>x==null||typeof x==='string';
function cleanCen(c){
  if(typeof c?.title!=='string'||!c.title.trim()||!optStr(c.note)||!Array.isArray(c.items))bad();
  const items=c.items.map(i=>{if(!i||typeof i.droga!=='string'||!i.droga.trim()||!RXF.every(([k])=>optStr(i[k])))bad();return Object.fromEntries(RXF.map(([k])=>[k,i[k]||'']))});
  return{old:String(c.id),cen:{id:newId(),title:c.title,note:c.note||'',items,at:Number.isFinite(c.at)?c.at:Date.now()}};
}
async function restoreBackup(file){
  if(!file)return;if(file.size>MAX_BACKUP_MB*1048576)return toast('Backup maior que '+MAX_BACKUP_MB+' MB');
  let items,cens,favs;
  try{const d=JSON.parse(await file.text());if(d?.app!=='painel-plantao'||d.versao!==1||!Array.isArray(d.files)||!(d.cenarios==null||Array.isArray(d.cenarios)))bad();items=d.files.map(cleanFile);cens=(d.cenarios||[]).map(cleanCen);if(!items.length&&!cens.length)bad();favs=Array.isArray(d.favs)?d.favs.filter(x=>typeof x==='string'):[]}
  catch{return toast('Backup inválido ou corrompido')}
  const what=[items.length&&plural(items.length,'arquivo','arquivos'),cens.length&&plural(cens.length,'cenário','cenários')].filter(Boolean).join(' e ');
  if(!confirm(`Restaurar ${what}? Itens com o mesmo nome serão substituídos.`))return;
  const before=S.files,beforeCens=S.cens,ids=new Map(items.map(x=>[x.old,x.file.id])),cenIds=new Map(cens.map(x=>[x.old,x.cen.id]));
  try{
    for(const{file:f}of items){await dbPut(f);for(const o of before.filter(x=>x.name===f.name)){await dbDel(o.id);S.favs=S.favs.filter(x=>!x.startsWith(o.id+':'))}}
    for(const{cen:c}of cens){await cenPut(c);for(const o of beforeCens.filter(x=>norm(x.title).trim()===norm(c.title).trim())){await cenDel(o.id);S.favs=S.favs.filter(x=>x!=='cen:'+o.id)}}
    const restored=favs.flatMap(x=>{if(x.startsWith('cen:')){const id=cenIds.get(x.slice(4));return id?['cen:'+id]:[]}const c=x.indexOf(':');if(c<0)return CALCS.some(k=>k.id===x)?[x]:[];const id=ids.get(x.slice(0,c));return id?[id+x.slice(c)]:[]});
    S.favs=[...new Set([...S.favs,...restored])];toast(what+(items.length+cens.length===1?' restaurado':' restaurados'));
  }catch{toast('A restauração não terminou. Verifique o espaço do navegador')}
  lset('pp.favs',S.favs);await reload();
}

/* Interface */
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)}
const count=k=>S.recs.filter(r=>r.cat===k).length+(k==='prescricoes'?S.cens.length:0);
const star=i=>{const on=S.favs.includes(i.id);return`<button class="star ${on?'on':''}" data-fav="${esc(i.id)}" aria-pressed="${on}" aria-label="Favoritar ${esc(i.title)}">${ic('star')}</button>`};
function doseCalc(c,w){const n=c.d>0?c.d:1;let cap=false;const lim=v=>{let r=v*w/n;if(c.cap>0&&r>c.cap){r=c.cap;cap=true}if(c.fl>0&&r<c.fl){r=c.fl;cap=true}return r},a=lim(c.a),b=lim(c.b),rg=(x,y,u)=>(x===y?fmt(x):fmt(x)+'–'+fmt(y))+' '+u;return{main:rg(a,b,c.u)+(c.d>0?' por tomada':'')+(c.c>0?' = '+rg(a/c.c,b/c.c,'mL'):''),cap}}
function excerpt(t,terms){const n=norm(t),i=Math.min(...terms.map(x=>{const p=n.indexOf(x);return p<0?1e9:p}));if(i===1e9||i<160)return null;return'… '+t.slice(i-120,i+320)+' …'}
function recCard(r,terms=[]){
  const w=weight();let calc='';
  if(r.calc){if(w){const d=doseCalc(r.calc,w);calc=`<div class="res"><small>Para ${fmt(w)} kg</small><b>${esc(d.main)}</b>${d.cap?'<em>Limite de dose aplicado</em>':''}<small>Calculado com os valores do seu arquivo</small></div>`}else calc='<div class="res"><small>Informe o peso para calcular a dose</small></div>'}
  let body='';if(r.text){const ex=excerpt(r.text,terms),t=ex||r.text;body=t.length>520?`<div class="body">${hl(t.slice(0,520),terms)}…</div><details><summary>Ver texto completo</summary><div class="body">${esc(r.text)}</div></details>`:`<div class="body">${hl(t,terms)}</div>${ex?`<details><summary>Ver texto completo</summary><div class="body">${esc(r.text)}</div></details>`:''}`}
  return`<article class="rec panel"><div class="ch"><div style="min-width:0"><h3>${hl(r.title,terms)}</h3><div class="src"><span class="dot" style="background:${CATS[r.cat][2]}"></span>${CATS[r.cat][0]} · ${esc(r.fname)}</div></div><div class="acts">${star(r)}</div></div>${calc}${r.fields?.length?`<dl>${r.fields.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${hl(v,terms)}</dd></div>`).join('')}</dl>`:''}${body}<div class="rf">${r.doc?'':`<button class="sec" data-copy="${esc(r.id)}">${ic('copy',15)}Copiar</button>`}${r.doc||['txt','md','docx'].includes(r.ext)?`<button class="sec" data-open="${esc(r.fid)}">${ic('open',15)}Abrir arquivo</button>`:''}</div></article>`;
}
function calcCard(c,T=[]){const w=weight(),sv=S.cv[c.id]||{};return`<article class="calc rec panel" id="${c.id}" data-calc="${c.id}"><div class="ch"><div><h3>${hl(c.title,T)}</h3><div class="src">${esc(c.desc)}</div></div>${star(c)}</div><div class="form">${c.f.map(([k,l,o,p])=>o==='check'?`<label class="ck"><input data-k="${k}" data-p="${p}" type="checkbox" ${sv[k]?'checked':''}>${esc(l)}</label>`:`<label>${esc(l)}${o?`<select data-k="${k}">${o.map(x=>`<option ${sv[k]===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<input data-k="${k}" type="number" step="any" inputmode="decimal" value="${esc(sv[k]??(k==='peso'&&w?w:''))}">`}</label>`).join('')}</div><div class="out" aria-live="polite"></div><div class="ca"><button class="sec" data-ccopy="${c.id}" aria-label="Copiar resultado de ${esc(c.title)}">${ic('copy',15)}Copiar</button><button class="sec" data-cclear="${c.id}" aria-label="Limpar ${esc(c.title)}">Limpar</button></div></article>`}
const chips=(items,cur,attr)=>`<div class="chips" role="group" aria-label="Filtros">${items.map(([k,l,n])=>`<button class="chip ${k===cur?'on':''}" data-${attr}="${k}" aria-pressed="${k===cur}">${l}${n!=null?`<span>${n}</span>`:''}</button>`).join('')}</div>`;
const byTitle=a=>[...a].sort((x,y)=>x.title.localeCompare(y.title,'pt-BR',{numeric:true,sensitivity:'base'}));
const cenTile=(i,T=[])=>`<button class="ctile" data-cen="${esc(i.cid)}"><span class="cic">${ic('clip',20)}</span><span class="ctx"><b>${hl(i.title,T)}</b><small>${plural(i.items.length,'medicamento','medicamentos')}</small></span>${ic('right',16)}</button>`;
const cards=(a,t)=>{const s=a.slice(0,LIMIT);return`<div class="grid">${s.map(i=>i.t==='calc'?calcCard(i,t):i.t==='cen'?cenTile(i,t):recCard(i,t)).join('')}</div>${a.length>LIMIT?`<p class="sub lim">Mostrando ${LIMIT} de ${a.length.toLocaleString('pt-BR')}. Refine a busca para ver os demais.</p>`:''}`};
const calcs=()=>CALCS.map(c=>({...c,t:'calc',nt:norm(c.title),hay:norm([c.title,c.alias,c.desc,CG[c.g],'calculadora'].join(' '))}));
const emptyBox=(icon,t,d,cat)=>`<div class="panel empty"><span class="emark">${ic(icon,30)}</span><b>${t}</b><span>${d}</span><button class="pri" data-import="${cat||''}">${ic('up')}Importar arquivos</button>${cat?`<button class="sec" data-new="${cat}">${ic('plus',15)}Escrever registro</button>`:''}</div>`;
const QUICK=['c-clcr','c-inf','c-holliday','c-ckdepi','c-gota','c-pam','c-glasgow'];
function home(){
  const tot=S.recs.length,w=weight(),h=w&&holliday(w),favs=[...S.recs,...S.cenItems,...calcs()].filter(x=>S.favs.includes(x.id)),go=(a,b,attr)=>`<button class="ri" ${attr}><span><b>${esc(a)}</b><small>${esc(b)}</small></span>${ic('right',15)}</button>`;
  return`<div class="home">
  <section class="block lib"><div class="bh"><div><h2>Biblioteca clínica</h2><p class="sub">${plural(tot,'registro','registros')} em ${plural(S.files.length,'arquivo','arquivos')}</p></div><button class="sec" data-new="">${ic('plus',15)}Novo registro</button></div>
   <div class="leg">${CK.map(k=>`<div><button class="idx" data-go="${k}" style="--k:${CATS[k][2]}">${ic(CATS[k][1],20)}<span>${CATS[k][0]}</span><b>${count(k).toLocaleString('pt-BR')}</b></button></div>`).join('')}</div>
   ${tot?'':`<button class="dropc" data-import="">${ic('up',22)}<span><b>Importar arquivos</b>Planilhas, PDFs, documentos, textos e imagens. Você também pode arrastá-los para a tela.</span></button>`}</section>
  <section class="block dosebox"><div class="bh"><h2>Cálculo por peso</h2></div><div class="screen"><b>${w?fmt(w):'--'}<i>kg</i></b><small>${w?'usado nesta sessão, não é salvo':'informe o peso no topo'}</small><div class="vals"><div><span>Manutenção/dia</span><b>${w?fmt(h)+' mL':'--'}</b></div><div><span>Manutenção/hora</span><b>${w?fmt(h/24)+' mL/h':'--'}</b></div></div></div><p class="note">Planilhas no <button class="link" data-template>modelo de doses</button> calculam a dose pelo peso.</p></section>
  <section class="block tri"><div class="bh"><h2>Calculadoras</h2></div><div class="rows">${QUICK.map(id=>{const c=CALCS.find(x=>x.id===id);return go(c.title,c.desc,`data-calcgo="${c.id}"`)}).join('')}</div><button class="sec more" data-go="calc">Ver todas as ${CALCS.length}</button></section>
  <section class="block tri"><div class="bh"><h2>Favoritos</h2></div><div class="rows">${favs.length?favs.slice(0,7).map(f=>go(f.title,f.t==='calc'?'Calculadora':f.t==='cen'?'Cenário de prescrição':CATS[f.cat][0],f.t==='cen'?`data-cen="${esc(f.cid)}"`:`data-find="${esc(f.title)}"`)).join(''):'<p class="sub">Marque a estrela de um item para deixá-lo aqui.</p>'}</div></section>
  <section class="block tri"><div class="bh"><h2>Arquivos recentes</h2></div><div class="rows">${S.files.length?S.files.slice(0,7).map(f=>go(f.name,CATS[f.cat][0]+' · '+new Date(f.at).toLocaleDateString('pt-BR'),'data-go="files"')).join(''):'<p class="sub">Os arquivos importados aparecem aqui.</p>'}</div></section>
  </div>`;
}
function cenList(){
  const a=S.recs.filter(r=>r.cat==='prescricoes');
  return`<section><div class="head"><div><h2 class="sh">Cenários</h2><p>Monte a prescrição de cada situação clínica.</p></div><div class="hbtn"><button class="sec m" data-chapter>${ic('search',15)}Ler capítulo em PDF</button><button class="pri" data-cenew>${ic('plus',16)}Novo cenário</button></div></div><div class="cgrid">${byTitle(S.cenItems).map(i=>cenTile(i)).join('')}<button class="ctile add" data-cenew><span class="cic">${ic('plus',20)}</span><span class="ctx"><b>Criar cenário</b><small>Nome, medicamentos e posologia</small></span></button></div></section><section class="secb"><h2 class="sh">Registros e arquivos</h2>${a.length?`<div class="head"><p>Em ordem alfabética.</p><button class="sec" data-new="prescricoes">${ic('plus',15)}Novo registro</button></div>`+cards(byTitle(a)):emptyBox('rx','Nenhum registro de prescrição','Importe arquivos ou escreva um texto livre.','prescricoes')}</section>`;
}
function cenView(c){
  const it=S.cenItems.find(x=>x.cid===c.id);
  return`<div class="head"><button class="sec" data-go="prescricoes">${ic('left',15)}Prescrições</button><div class="hbtn">${star(it)}<button class="sec" data-cencopy>${ic('copy',15)}Copiar prescrição</button><button class="sec" data-cenedit>Editar</button><button class="sec" data-cendel>${ic('trash',15)}Excluir</button></div></div>${c.note?`<div class="priv cnote">${esc(c.note)}</div>`:''}${c.items.length?`<ol class="rxl">${c.items.map((i,n)=>`<li class="rxi"><span class="rxn">${n+1}</span><div class="rxb"><b>${esc(i.droga)}</b>${i.apresentacao?`<span class="rxa">${esc(i.apresentacao)}</span>`:''}${i.posologia?`<p class="rxp">${esc(i.posologia)}</p>`:''}${i.via||i.obs?`<div class="rxm">${i.via?`<span class="tag">Via ${esc(i.via)}</span>`:''}${i.obs?`<span class="rxo">${esc(i.obs)}</span>`:''}</div>`:''}${i.ref?`<p class="rxr"><span class="tag">Fonte</span>${esc(i.ref)}</p>`:''}</div></li>`).join('')}</ol>`:`<div class="panel empty"><b>Nenhum medicamento ainda</b><span>Adicione os medicamentos deste cenário.</span><button class="pri" data-cenedit>Adicionar medicamentos</button></div>`}`;
}
function filesView(){
  return`<div class="head"><p>Gerencie o que foi importado. O backup guarda arquivos, cenários e favoritos, sem criptografia.</p><div class="hbtn"><button class="sec" data-new="">${ic('plus',15)}Novo registro</button><button class="sec" data-backup>${ic('down',15)}Exportar backup</button><button class="sec" data-restore>${ic('up',15)}Restaurar backup</button><button class="sec" data-template>Baixar modelo de doses</button></div></div>${S.files.length?`<section class="panel flist">${S.files.map(f=>{const t=FT[f.ext];return`<div class="ft"><div class="ext" style="--a:${t[0]};--b:${t[1]}">${esc(f.ext.slice(0,4).toUpperCase())}</div><div style="min-width:0"><b title="${esc(f.name)}">${esc(f.name)}</b><small>${new Date(f.at).toLocaleDateString('pt-BR')} · ${size(f.size)}</small></div><div class="fsel"><select class="sel" style="margin:0" data-fc="${f.id}" aria-label="Categoria de ${esc(f.name)}">${catOpts(f.cat)}</select></div><small class="fn">${f.recs[0]?.doc?'Documento':plural(f.recs.length,'registro','registros')}</small><div>${f.ext==='pdf'?`<button class="icon" data-extract="${f.id}" aria-label="Extrair doses de ${esc(f.name)}" title="Extrair doses">${ic('search',16)}</button>`:''}<button class="icon" data-open="${f.id}" aria-label="Abrir ${esc(f.name)}" title="Abrir">${ic('open',16)}</button><button class="icon" data-del="${f.id}" aria-label="Excluir ${esc(f.name)}" title="Excluir">${ic('trash',16)}</button></div></div>`}).join('')}</section>`:emptyBox('box','Nenhum arquivo importado','CSV, TSV, XLSX, JSON, TXT, MD, DOCX, PDF e imagens.')}`;
}
function search(t){const T=norm(t).split(/\s+/).filter(Boolean);return{T,a:[...S.recs,...S.cenItems,...calcs()].filter(i=>T.every(x=>i.hay.includes(x))).map(i=>[i,T.reduce((s,x)=>s+(i.nt.startsWith(x)?3:i.nt.includes(x)?2:0),0)]).sort((a,b)=>b[1]-a[1]).map(x=>x[0])}}
function runCalcs(){view.querySelectorAll('[data-calc]').forEach(el=>{const c=CALCS.find(x=>x.id===el.dataset.calc),v={},raw=S.cv[c.id]={};let ok=true;el.querySelectorAll('[data-k]').forEach(i=>{const k=i.dataset.k;if(i.type==='checkbox'){raw[k]=i.checked;v[k]=i.checked?+i.dataset.p:0}else if(i.tagName==='SELECT')raw[k]=v[k]=i.value;else{raw[k]=i.value;const n=parseFloat(i.value);if(!(n>0))ok=false;v[k]=n}});const r=ok?c.run(v):null,o=el.querySelector('.out');o.textContent=r||(ok?'Confira os valores':'Preencha os campos');o.classList.toggle('w',!r)})}
function navHTML(){const t=q.value.trim(),b=(id,l,i,n)=>`<button data-go="${id}" class="${!t&&S.view===id?'on':''}" ${!t&&S.view===id?'aria-current="page"':''}>${ic(i)}<span>${l}</span><span class="n">${n??''}</span></button>`;
  $('#nav').innerHTML=NAV.map(([id,l,i])=>b(id,l,i,CATS[id]?count(id)||'':id==='fav'?S.favs.length||'':id==='calc'?CALCS.length:'')).join('');$('#nav2').innerHTML=b('files','Arquivos','up',S.files.length||'');
  $('#seg').innerHTML=[['light','sun','Tema claro'],['dark','moon','Tema escuro']].map(([k,i,l])=>`<button data-theme-set="${k}" class="${S.theme===k?'on':''}" aria-label="${l}" aria-pressed="${S.theme===k}">${ic(i,15)}</button>`).join('')+`<button data-themes class="${S.theme!=='light'&&S.theme!=='dark'?'on':''}" aria-pressed="${S.theme!=='light'&&S.theme!=='dark'}" aria-label="Mais temas" title="Mais temas">${ic('palette',15)}</button>`}
function render(){
  applyTheme();navHTML();const t=q.value.trim(),v=S.view;let h,title;
  if(t){const r=search(t),kind=i=>i.t==='calc'?'calc':i.cat,has=[...CK,'calc'].map(k=>[k,k==='calc'?'Calculadoras':CATS[k][0],r.a.filter(i=>kind(i)===k).length]).filter(x=>x[2]),f=has.some(x=>x[0]===S.sf)?S.sf:'all',a=f==='all'?r.a:r.a.filter(i=>kind(i)===f);title=`Busca <span>${a.length}</span>`;h=a.length?(has.length>1?chips([['all','Todos',r.a.length],...has],f,'sf'):'')+cards(a,r.T):`<div class="panel empty"><b>Nada encontrado</b><span>Tente outro termo ou importe mais arquivos.</span></div>`}
  else if(v==='home'){const d=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});title=d[0].toUpperCase()+d.slice(1);h=home()}
  else if(v==='prescricoes'&&S.cens.some(c=>c.id===S.cen)){const c=S.cens.find(x=>x.id===S.cen);title=esc(c.title);h=cenView(c)}
  else if(v==='prescricoes'){title=`Prescrições <span>${count(v)||''}</span>`;h=cenList()}
  else if(CATS[v]){const a=S.recs.filter(r=>r.cat===v);title=`${CATS[v][0]} <span>${a.length||''}</span>`;h=a.length?`<div class="head"><p>Em ordem alfabética.</p><button class="sec" data-new="${v}">${ic('plus',15)}Novo registro</button></div>`+cards(byTitle(a)):emptyBox(CATS[v][1],`Nada em ${CATS[v][0].toLowerCase()} ainda`,'Importe um arquivo para preencher esta seção.',v)}
  else if(v==='calc'){const all=calcs(),a=S.cg==='all'?all:all.filter(c=>c.g===S.cg);title=`Calculadoras <span>${a.length}</span>`;h=`<div class="head"><p>Apoio ao cálculo. Confira os valores antes de usar.</p></div>`+chips(Object.entries(CG).map(([k,l])=>[k,l,k==='all'?all.length:all.filter(c=>c.g===k).length]),S.cg,'cg')+cards(a)}
  else if(v==='fav'){const a=[...S.recs,...S.cenItems,...calcs()].filter(i=>S.favs.includes(i.id));title='Favoritos';h=a.length?cards(a):'<div class="panel empty"><b>Nenhum favorito ainda</b><span>Marque a estrela de um item para encontrá-lo aqui.</span></div>'}
  else{title='Arquivos';h=filesView()}
  $('#title').innerHTML=title;view.innerHTML=h;runCalcs();
}
async function copy(text,b){try{await navigator.clipboard.writeText(text)}catch{const a=document.createElement('textarea');a.value=text;document.body.append(a);a.select();document.execCommand('copy');a.remove()}toast('Copiado');b.blur()}
const go=v=>{S.view=v;S.cen=null;S.sf='all';q.value='';render();scrollTo(0,0)};
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if('import' in d){S.cat=d.import;$('#file').value='';$('#file').click()}
  else if(d.go)go(d.go);
  else if(d.themeSet){S.theme=d.themeSet;lset('pp.theme',S.theme);render();if(S.themeOpen)drawThemes()}
  else if('themes' in d){S.themeOpen=true;drawThemes();dlg.showModal()}
  else if(d.fav){S.favs=S.favs.includes(d.fav)?S.favs.filter(x=>x!==d.fav):[...S.favs,d.fav];lset('pp.favs',S.favs);render()}
  else if(d.find){S.sf='all';q.value=d.find;render();scrollTo(0,0)}
  else if(d.sf){S.sf=d.sf;render()}
  else if(d.cg){S.cg=d.cg;render()}
  else if('updates' in d)openUpdates();
  else if(d.upd)desk[d.upd]();
  else if('new' in d)newRec(d.new);
  else if('savenew' in d)saveNew();
  else if('backup' in d)exportBackup();
  else if('restore' in d){$('#restore').value='';$('#restore').click()}
  else if(d.ccopy){const c=CALCS.find(x=>x.id===d.ccopy),o=document.getElementById(c.id).querySelector('.out');if(o.classList.contains('w'))toast('Ainda não há resultado para copiar');else copy(c.title+': '+o.textContent,b)}
  else if(d.cclear){delete S.cv[d.cclear];render()}
  else if(d.calcgo){S.cg='all';go('calc');document.getElementById(d.calcgo)?.scrollIntoView({block:'center'});document.querySelector('#'+d.calcgo+' input')?.focus({preventScroll:true})}
  else if('template' in d)template();
  else if(d.copy){const r=S.recs.find(x=>x.id===d.copy);copy([r.title,...(r.fields||[]).map(([k,v])=>k+': '+v),r.text].filter(Boolean).join('\n'),b)}
  else if(d.open)openFile(d.open);
  else if(d.del){const f=S.files.find(x=>x.id===d.del);if(f&&confirm(`Excluir "${f.name}" e seus registros?`)){await dbDel(f.id);S.favs=S.favs.filter(x=>!x.startsWith(f.id+':'));lset('pp.favs',S.favs);toast('Arquivo excluído');reload()}}
  else if(d.cen){S.view='prescricoes';S.cen=d.cen;S.sf='all';q.value='';render();scrollTo(0,0)}
  else if('cenew' in d)openCenEdit(null);
  else if('cenedit' in d)openCenEdit(S.cen);
  else if('cendel' in d)deleteCen(S.cen);
  else if('cencopy' in d){const c=S.cens.find(x=>x.id===S.cen);if(c)copy(cenText(c),b)}
  else if('censave' in d)saveCen();
  else if('rowadd' in d){syncEdit();S.edit.items.push(blankRx());drawCenEdit();dlg.querySelector(`[data-row="${S.edit.items.length-1}"] input`).focus()}
  else if(d.rowdel){syncEdit();S.edit.items.splice(+d.rowdel,1);drawCenEdit()}
  else if(d.rowmove){syncEdit();const[i,s]=d.rowmove.split(':').map(Number),a=S.edit.items;[a[i],a[i+s]]=[a[i+s],a[i]];drawCenEdit()}
  else if('chapter' in d){$('#chapter').value='';$('#chapter').click()}
  else if(d.extract){const f=S.files.find(x=>x.id===d.extract);if(f)readChapter(f.blob,f.name)}
  else if('chall' in d){chapRows().slice(0,SHOW).forEach(([,i])=>S.chap.sel.add(i));drawChapList()}
  else if('chnone' in d){S.chap.sel.clear();drawChapList()}
  else if('chtake' in d)takeChapter();
  else if('cancel' in d)closeDialog();
  else if('commit' in d)commit();
});
document.addEventListener('change',async e=>{const t=e.target,d=t.dataset;
  if(t.id==='file')prepare(t.files);else if(t.id==='restore')restoreBackup(t.files[0]);else if(t.id==='chapter'){if(t.files[0])readChapter(t.files[0],t.files[0].name)}
  else if(t.id==='cha'){S.chap.all=t.checked;drawChapList()}else if(t.id==='chd')S.chap.dest=t.value;else if(t.id==='chj')S.chap.join=t.checked;else if(d.chs){S.chap.sel[t.checked?'add':'delete'](+d.chs);drawChapCount()}else if(d.pc)S.pending[d.pc].cat=t.value;else if(d.rep)S.pending[d.rep].replace=t.checked;
  else if(d.fc){const f=S.files.find(x=>x.id===d.fc);f.cat=t.value;await dbPut(f);reload()}
  else if(t.closest('[data-calc]'))runCalcs()});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='chq'){S.chap.filter=t.value;drawChapList()}else if(t.id==='chf')S.chap.fonte=t.value;else if(t.closest('[data-calc]'))runCalcs()});
q.addEventListener('input',()=>{S.sf='all';render()});
kg.addEventListener('input',()=>{Object.values(S.cv).forEach(v=>delete v.peso);if(S.view==='calc'&&!q.value.trim()){const w=weight();view.querySelectorAll('[data-k=peso]').forEach(i=>i.value=w||'');runCalcs()}else render()});
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();q.focus();q.select()}else if(e.key==='Escape'&&document.activeElement===q){q.value='';render()}});
const hasFiles=e=>[...(e.dataTransfer?.types||[])].includes('Files');
addEventListener('dragover',e=>{if(hasFiles(e)){e.preventDefault();$('#drop').classList.add('on')}});
addEventListener('dragleave',e=>{if(!e.relatedTarget)$('#drop').classList.remove('on')});
addEventListener('drop',e=>{if(hasFiles(e)){e.preventDefault();$('#drop').classList.remove('on');S.cat='';prepare(e.dataTransfer.files)}});
if(desk){$('#upd').innerHTML=ic('sync',16);$('#upd').hidden=false;desk.onState(u=>{S.upd=u;if(S.updOpen)drawUpdates()})}
SCHEME.addEventListener('change',()=>{if(S.theme==='system')applyTheme()});
$('#logo').innerHTML=ic('pulse',22);$('#si').innerHTML=ic('search',16);$('#pi').innerHTML=ic('up',17);
render();reload();
</script>
